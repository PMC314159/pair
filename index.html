<style>
  /* 미리보기 전체에도 부드러운 모서리를 적용합니다. */
  #sheet {
    border-radius: 22px;
    box-shadow: 0 14px 50px #00000028;
  }

  #imageEditor {
    border-radius: 16px;
  }

  #mainUpload .block,
  #characterForm .block {
    border-top: 0;
    border-radius: 14px;
    padding: 12px;
    background: #ffffff05;
  }

  #imageAdjustGroup {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }

  #imageAdjustGroup > h3 {
    margin: 0 0 8px;
    font-size: 13px;
  }
</style>

<script>
(() => {
  'use strict';

  /*
   * 기존 스크립트 뒤에 추가하는 수정 코드입니다.
   * 기존 편집 파일도 그대로 불러올 수 있습니다.
   */

  /* 02번과 04번 편집 영역을 합칩니다. */
  const mainSection = $('mainUpload').closest('details');
  const adjustSection = $('imageEditor').closest('details');

  if (mainSection && adjustSection &&
      mainSection !== adjustSection) {
    mainSection.querySelector('summary').textContent =
      '02 / 일러스트 · 이미지 조절';

    const group = document.createElement('div');
    group.id = 'imageAdjustGroup';

    const heading = document.createElement('h3');
    heading.textContent = '선택한 이미지 조절 · 색상 추출';
    group.append(heading);

    [...adjustSection.children].forEach(node => {
      if (node.tagName !== 'SUMMARY') {
        group.append(node);
      }
    });

    mainSection.append(group);
    adjustSection.remove();
  }

  /*
   * 이름은 한 줄 입력을 유지하고,
   * 키·몸무게·기본 정보는 여러 줄 입력을 허용합니다.
   */
  const originalField = field;

  field = function(parent, title, value, onChange, area = false) {
    const multiline =
      area ||
      title.startsWith('키 (') ||
      title.startsWith('몸무게 (') ||
      title.startsWith('간단한 정보');

    originalField(parent, title, value, onChange, multiline);
  };

  /*
   * 이미지 칸:
   * 점선과 테두리를 그리지 않고 둥근 모서리로 자릅니다.
   */
  imageSlot = function(
    ctx, s, x, y, w, h, label, preview
  ) {
    if (w <= 0 || h <= 0) return;

    const image = s.src
      ? cache.get(s.src + '#loaded')
      : null;

    ctx.save();
    rounded(ctx, x, y, w, h, 24);
    ctx.clip();

    if (image) {
      const baseScale = s.fit === 'cover'
        ? Math.max(w / image.width, h / image.height)
        : Math.min(w / image.width, h / image.height);

      const imageScale = baseScale * s.zoom;
      const dw = image.width * imageScale;
      const dh = image.height * imageScale;

      ctx.drawImage(
        image,
        x + (w - dw) / 2 + s.x / 100 * w,
        y + (h - dh) / 2 + s.y / 100 * h,
        dw,
        dh
      );
    } else if (preview) {
      /* 안내 문구만 표시합니다. 테두리는 없습니다. */
      ctx.globalAlpha = 0.24;
      font(ctx, 13);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, x + w / 2, y + h / 2);
    }

    ctx.restore();
  };

  /*
   * 이름 영역 높이는 양쪽 중 긴 이름에 맞춥니다.
   * 이 높이 뒤에서 두상과 메인 일러스트가 함께 시작합니다.
   */
  function nameAreaHeight(ctx, p, w) {
    return textHeight(ctx, p.name || ' ', w - 20, 25);
  }

  function commonNameHeight(ctx, w) {
    const people = state.mode === 'pair'
      ? state.people
      : [state.people[0]];

    return Math.max(
      ...people.map(p => nameAreaHeight(ctx, p, w))
    ) + 8;
  }

  headerHeight = function(ctx, p, w) {
    return commonNameHeight(ctx, w);
  };

  /*
   * 측정時と描画時で同じ関数を使い、
   * 必要な高さだけを確保します。
   */
  function compactSide(ctx, p, x, y, w, accent, preview) {
    const start = y;
    const headerH = commonNameHeight(ctx, w);
    const nameH = nameAreaHeight(ctx, p, w);

    /* 名前は下端をそろえ、頭像との間隔を小さくします。 */
    const nameY = y + headerH - nameH - 8;

    font(ctx, 25, 700);

    const nameLines = lines(ctx, p.name || ' ', w - 20);
    const metrics = ctx.measureText(nameLines[0] || '가');
    const ascent = metrics.actualBoundingBoxAscent ?? 0;
    const descent = metrics.actualBoundingBoxDescent ?? 25;

    const visibleNameH = Math.max(
      1,
      ascent + descent + (nameLines.length - 1) * 40
    );

    rect(
      ctx,
      x,
      nameY - ascent,
      4,
      visibleNameH,
      accent,
      2
    );

    text(ctx, p.name || '', x + 16, nameY, w - 20, 25, 700);
    y += headerH;

    /* 두상: 외곽선 없이 둥근 이미지 블록으로 표시합니다. */
    rect(ctx, x, y, w, 276, state.card, 24);

    imageSlot(
      ctx, p.portrait,
      x, y, w, 276,
      '두상 일러스트', preview
    );

    y += 288;

    function infoCard(title, value) {
      if (!String(value || '').trim()) return;

      const contentW = w - 28;
      const titleH = textHeight(ctx, title, contentW, 12);
      const contentH = textHeight(ctx, value, contentW, 18);

      /* 위 12 + 제목 + 간격 7 + 본문 + 아래 12 */
      const h = 12 + titleH + 7 + contentH + 12;

      rect(ctx, x, y, w, h, state.card, 20);

      text(ctx, title, x + 14, y + 12, contentW, 12, 700);

      text(
        ctx, value,
        x + 14, y + 12 + titleH + 7,
        contentW, 18
      );

      y += h + 12;
    }

    const index = state.people.indexOf(p);

    const relationTitle = state.mode === 'pair'
      ? (p.name || (index === 0 ? 'A' : 'B')) +
        ' → ' +
        (state.people[1 - index].name ||
          (index === 0 ? 'B' : 'A'))
      : 'ABOUT / 캐릭터 소개';

    infoCard(relationTitle, p.relation);

    /* 나나곰 */
    rect(ctx, x, y, w, 194, state.card, 24);

    text(
      ctx, 'NANAGOM / 나나곰',
      x + 14, y + 12, w - 28, 11, 600
    );

    imageSlot(
      ctx, p.sd,
      x + 10, y + 34, w - 20, 150,
      '나나곰 · SD', preview
    );

    y += 206;

    /*
     * 기본 정보는 항목별로 줄을 나눕니다.
     * 각 입력 내용 안의 줄바꿈도 그대로 유지합니다.
     */
    const basic = [
      p.height ? '키  ' + p.height : '',
      p.weight ? '몸무게  ' + p.weight : '',
      p.meta || ''
    ].filter(Boolean).join('\n');

    infoCard('PROFILE / 기본 정보', basic);
    infoCard('FEATURES / 특징', p.features);
    infoCard('SPEECH / 말투 · 호칭', p.speech);
    infoCard('NG / 주의 사항', p.ng);

    /* 색상 파츠 */
    rect(ctx, x, y, w, 118, state.card, 22);

    const colorW = (w - 28) / 3;

    p.colors.forEach((color, i) => {
      const xx = x + 14 + i * colorW;
      const innerW = colorW - 8;

      rect(ctx, xx, y + 12, innerW, 42, color.hex, 12);

      if (color.image.src) {
        imageSlot(
          ctx, color.image,
          xx, y + 12, innerW, 42,
          '', preview
        );
      }

      rect(ctx, xx, y + 61, innerW, 5, color.hex, 2);

      text(ctx, color.label, xx, y + 74, innerW, 12, 600);

      text(
        ctx, color.hex.toUpperCase(),
        xx, y + 94, innerW, 10
      );
    });

    y += 130;

    if (p.stats.enabled) {
      y += drawRadar(ctx, p, x, y, w, accent);
    }

    /* 最後のカードの後ろに余白を追加しません。 */
    return y - start - (p.stats.enabled ? 16 : 12);
  }

  drawSide = compactSide;

  /*
   * 추가 파츠:
   * 중앙 하단에서 작은 카드로 배치합니다.
   * 이미지 높이는 110px입니다.
   * 행마다 가장 높은 카드에 맞추되 다음 행까지 12px만 둡니다.
   */
  function compactCenter(ctx, x, y, w, preview) {
    const start = y;
    const people = state.mode === 'pair'
      ? state.people
      : [state.people[0]];

    const entries = people.flatMap(p =>
      p.extras.map(e => ({ p, e }))
    );

    const gap = 12;
    const cols = 2;
    const cardW = (w - gap) / cols;
    const imageH = 110;

    for (let i = 0; i < entries.length; i += cols) {
      const row = entries.slice(i, i + cols);

      const specs = row.map(({ p, e }) => {
        const title = (p.name || '캐릭터') + ' / ' + e.title;
        const titleH = textHeight(ctx, title, cardW - 24, 12);
        const bodyH = e.text
          ? textHeight(ctx, e.text, cardW - 24, 14)
          : 0;

        /*
         * 빈 이미지도 미리보기/저장 높이를 동일하게 유지합니다.
         * 저장할 때 안내 문구만 사라집니다.
         */
        const h =
          12 + titleH + 8 + imageH +
          (bodyH ? 8 + bodyH : 0) + 12;

        return { title, titleH, h };
      });

      const rowH = Math.max(...specs.map(item => item.h));

      row.forEach(({ e }, j) => {
        const xx = x + j * (cardW + gap);
        const spec = specs[j];

        rect(ctx, xx, y, cardW, spec.h, state.card, 20);

        text(
          ctx, spec.title,
          xx + 12, y + 12, cardW - 24, 12, 700
        );

        const imageY = y + 12 + spec.titleH + 8;

        imageSlot(
          ctx, e.image,
          xx + 10, imageY, cardW - 20, imageH,
          '외관 특징 파츠', preview
        );

        if (e.text) {
          text(
            ctx, e.text,
            xx + 12, imageY + imageH + 8,
            cardW - 24, 14
          );
        }
      });

      y += rowH + gap;
    }

    /* 테마곡은 입력한 경우에만 표시합니다. */
    const themed = people.filter(p => p.theme || p.themeArtist);

    if (themed.length) {
      const themeW =
        (w - gap * (themed.length - 1)) / themed.length;

      const specs = themed.map(p => {
        const label = 'THEME / ' + (p.name || '캐릭터');
        const labelH = textHeight(ctx, label, themeW - 24, 11);

        const titleH = p.theme
          ? textHeight(ctx, p.theme, themeW - 24, 16)
          : 0;

        const artistH = p.themeArtist
          ? textHeight(ctx, p.themeArtist, themeW - 24, 12)
          : 0;

        return {
          label,
          labelH,
          titleH,
          artistH,
          h: 12 + labelH +
            (titleH ? 7 + titleH : 0) +
            (artistH ? 5 + artistH : 0) + 12
        };
      });

      themed.forEach((p, i) => {
        const xx = x + i * (themeW + gap);
        const spec = specs[i];

        rect(ctx, xx, y, themeW, spec.h, state.card, 20);

        let yy = y + 12;

        yy += text(
          ctx, spec.label,
          xx + 12, yy, themeW - 24, 11, 700
        );

        if (p.theme) {
          yy += 7;
          yy += text(
            ctx, p.theme,
            xx + 12, yy, themeW - 24, 16, 600
          );
        }

        if (p.themeArtist) {
          text(
            ctx, p.themeArtist,
            xx + 12, yy + 5, themeW - 24, 12
          );
        }
      });

      y += Math.max(...specs.map(item => item.h)) + gap;
    }

    return Math.max(0, y - start - gap);
  }

  centerExtras = compactCenter;

  /*
   * 전체 배치:
   * 양쪽 정보 높이에서 하단 파츠 높이를 뺀 만큼을
   * 중앙 일러스트 영역으로 사용합니다.
   */
  draw = async function(canvas, scale = 1, preview = true) {
    await preload();

    const measure =
      document.createElement('canvas').getContext('2d');

    const pair = state.mode === 'pair';
    const sideW = pair ? 330 : 370;
    const gap = 28;
    const padding = 58;

    const centerX = padding + sideW + gap;
    const centerW =
      1600 - padding * 2 - sideW - gap -
      (pair ? sideW + gap : 0);

    const top = state.title ? 145 : 76;
    const nameH = commonNameHeight(measure, sideW);

    const leftH = compactSide(
      measure, state.people[0],
      padding, top, sideW,
      state.accentA, preview
    );

    const rightH = pair
      ? compactSide(
          measure, state.people[1],
          1600 - padding - sideW, top, sideW,
          state.accentB, preview
        )
      : 0;

    const extraH = compactCenter(
      measure, centerX, 0, centerW, preview
    );

    const extraGap = extraH ? 12 : 0;
    const sideH = Math.max(leftH, rightH);

    /*
     * 固定980pxを撤廃します。
     * 최소 일러스트 높이를 제외하면 양쪽 높이에 맞춥니다.
     */
    const mainH = Math.max(
      420,
      sideH - nameH - extraGap - extraH
    );

    const centerH = nameH + mainH + extraGap + extraH;
    const bodyH = Math.max(sideH, centerH);

    const bottom = state.credit ? 56 : 26;
    const height = Math.ceil(top + bodyH + bottom);

    canvas.width = 1600 * scale;
    canvas.height = height * scale;

    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);

    ctx.fillStyle = state.bg;
    ctx.fillRect(0, 0, 1600, height);

    if (state.title) {
      font(ctx, 38, 500);
      ctx.textAlign = 'center';
      ctx.fillText(state.title, 800, 36);
    }

    if (state.subtitle) {
      font(ctx, 12, 500);
      ctx.textAlign = 'center';
      ctx.fillText(state.subtitle, 800, state.title ? 94 : 30);
    }

    compactSide(
      ctx, state.people[0],
      padding, top, sideW,
      state.accentA, preview
    );

    if (pair) {
      compactSide(
        ctx, state.people[1],
        1600 - padding - sideW, top, sideW,
        state.accentB, preview
      );
    }

    /* メインイラストと頭像の開始位置を一致させます。 */
    const mainY = top + nameH;

    rect(
      ctx, centerX, mainY,
      centerW, mainH, state.card, 26
    );

    if (!pair) {
      imageSlot(
        ctx, state.people[0].body,
        centerX, mainY, centerW, mainH,
        '메인 일러스트 / 전신', preview
      );
    } else if (state.layout === 'main') {
      imageSlot(
        ctx, state.main,
        centerX, mainY, centerW, mainH,
        '페어 메인 일러스트', preview
      );
    } else {
      const bodyW = (centerW - 12) / 2;

      imageSlot(
        ctx, state.people[0].body,
        centerX, mainY, bodyW, mainH,
        'A 전신', preview
      );

      imageSlot(
        ctx, state.people[1].body,
        centerX + bodyW + 12, mainY, bodyW, mainH,
        'B 전신', preview
      );
    }

    if (extraH) {
      compactCenter(
        ctx, centerX, mainY + mainH + extraGap,
        centerW, preview
      );
    }

    if (state.credit) {
      font(ctx, 13);
      ctx.textAlign = 'center';
      ctx.fillText(state.credit, 800, height - 32);
    }

    return { width: 1600, height };
  };

  /* 변경된 입력창과 미리보기를 갱신합니다. */
  mountCharacter();
  render();
})();
</script>
